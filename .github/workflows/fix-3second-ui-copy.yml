name: Fix 3-second monitoring UI text

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-3second-ui-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update UI text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          old = '''        "- 코레일 로그인정보를 수집하지 않습니다.\\n"\n        "- 예약·결제 버튼을 실행하지 않습니다.\\n"\n        "- 실제 페이지 조회 간격은 최소 30초입니다.\\n"\n        "- 접속제한 또는 추가 확인 화면이 나오면 우회하지 않고 재시도합니다.\\n"\n        "- 3초 조회는 연습용 시뮬레이션에만 사용합니다."\n'''

          new = '''        "- 코레일 로그인정보를 수집하지 않습니다.\\n"\n        "- 예약·결제 버튼을 실행하지 않습니다.\\n"\n        "- 사용자 모니터링 작업은 3초부터 실행됩니다.\\n"\n        "- 동일 열차의 코레일 페이지 새 조회는 30초 동안 공유됩니다.\\n"\n        "- 접속제한 또는 추가 확인 화면이 나오면 우회하지 않고 재시도합니다."\n'''

          if old not in text:
              raise RuntimeError("Expected provider UI text was not found")

          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
          )
          PY

      - name: Validate
        run: python -m py_compile app.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Clarify 3-second shared-cache mode"
          git push
