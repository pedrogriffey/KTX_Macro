name: Fix empty saved jobs crash

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-empty-saved-jobs.yml

permissions:
  contents: write

jobs:
  fix-app:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix saved-job block indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          start_marker = "\nselected_interval = int(\n"
          end_marker = (
              "\n    st.caption(\n"
              "        \"실제 잔여석 확인은 코레일 공개 예매페이지를 최소 30초 간격으로 \""
          )

          if start_marker not in text:
              print("The saved-job block is already fixed or the expected marker changed.")
              raise SystemExit(0)

          start = text.index(start_marker) + 1
          end = text.index(end_marker, start)

          block = text[start:end]
          fixed_block = "\n".join(
              ("    " + line if line else "")
              for line in block.splitlines()
          )

          updated = text[:start] + fixed_block + text[end:]
          path.write_text(updated, encoding="utf-8")

          print("Fixed app.py saved-job management indentation.")
          PY

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit the fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py

          if git diff --cached --quiet; then
            echo "No app.py change was needed."
          else
            git commit -m "Fix empty saved jobs crash"
            git push
          fi
