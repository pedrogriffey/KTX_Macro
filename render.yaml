services:
  - type: worker
    name: ktx-seat-monitor-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-worker.txt
    startCommand: python worker.py
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "1"
      - key: WORKER_BATCH_SIZE
        value: "20"
      - key: WORKER_HEARTBEAT_SECONDS
        value: "15"
      - key: LOG_LEVEL
        value: "INFO"
