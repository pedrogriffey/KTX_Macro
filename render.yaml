services:
  - type: worker
    name: ktx-seat-monitor-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "1"
      - key: WORKER_BATCH_SIZE
        value: "20"
      - key: WORKER_HEARTBEAT_SECONDS
        value: "15"
      - key: KORAIL_SEARCH_URL
        value: "https://www.korail.com/ticket/search"
      - key: KORAIL_BROWSER_TIMEOUT_MS
        value: "30000"
      - key: KORAIL_SHARED_CACHE_SECONDS
        value: "30"
      - key: LOG_LEVEL
        value: "INFO"
